<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Tannu 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Georgia, serif;
  background:linear-gradient(180deg,#ffb0b0,#ffd6dc);
}
.card{
  background:white;
  padding:40px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
}
button{
  padding:14px 28px;
  border-radius:30px;
  border:none;
  font-size:17px;
  margin:10px;
  cursor:pointer;
}
.yes{background:#e75480;color:white;}
.no{background:#eee;}
#noMsg{display:none;margin-top:10px;}
</style>
</head>
<body>

<div class="card">
  <h1>Tannu 💖</h1>
  <p>Okay… serious question.</p>
  <p><strong>Will you be my Valentine?</strong></p>

  <button class="yes" onclick="location.href='yes.html'">YES 💖</button>
  <button class="no" onclick="document.getElementById('noMsg').style.display='block'">NO 🙃</button>

  <p id="noMsg">Nice try 😌</p>
</div>

</body>
</html>
